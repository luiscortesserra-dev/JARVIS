<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>JARVIS</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');
  :root{ --bg:#0a0e14; --surface:#121824; --surface-2:#1a2230; --line:#232c3d; --cyan:#4cc9f0; --amber:#ffb627; --text:#e8edf2; --muted:#6b7684; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; height:100dvh; }
  header{ display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 14px) 18px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, var(--surface), var(--bg)); }
  .reactor{ position:relative; width:34px; height:34px; flex-shrink:0; }
  .reactor svg{ width:100%; height:100%; }
  .reactor .core{ fill:var(--cyan); filter:drop-shadow(0 0 6px var(--cyan)); transform-origin:50% 50%; animation:pulse 2.4s ease-in-out infinite; }
  .reactor .ring{ fill:none; stroke:var(--cyan); stroke-width:1.4; opacity:.55; }
  @keyframes pulse{ 0%,100%{ opacity:.65; transform:scale(1); } 50%{ opacity:1; transform:scale(1.12); } }
  .reactor.thinking .core{ animation-duration:.9s; }
  .brand{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .name{ font-family:'Space Mono',monospace; font-size:15px; letter-spacing:.14em; font-weight:700; }
  .brand .status{ font-size:11px; color:var(--muted); letter-spacing:.04em; }
  .brand .status.online{ color:var(--cyan); }
  .header-btn{ margin-left:auto; background:none; border:1px solid var(--line); color:var(--muted); width:34px; height:34px; border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center; }
  #chat{ flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:14px; }
  .msg{ max-width:84%; padding:11px 14px; border-radius:14px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user{ align-self:flex-end; background:var(--surface-2); border:1px solid var(--line); border-bottom-right-radius:4px; }
  .msg.jarvis{ align-self:flex-start; background:transparent; border-left:2px solid var(--cyan); border-radius:2px 14px 14px 2px; padding-left:13px; color:var(--text); }
  .msg.jarvis .label{ display:block; font-family:'Space Mono',monospace; font-size:10px; color:var(--cyan); letter-spacing:.12em; margin-bottom:4px; }
  .msg.system{ align-self:center; color:var(--muted); font-size:12px; font-family:'Space Mono',monospace; text-align:center; }
  .typing{ align-self:flex-start; display:flex; gap:5px; padding:8px 4px 8px 13px; border-left:2px solid var(--cyan); }
  .typing span{ width:5px; height:5px; border-radius:50%; background:var(--cyan); animation:bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-4px); opacity:1; } }
  #inputbar{ display:flex; align-items:flex-end; gap:10px; padding:12px 14px calc(env(safe-area-inset-bottom) + 12px); background:var(--surface); border-top:1px solid var(--line); }
  #inputbar textarea{ flex:1; resize:none; max-height:110px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; color:var(--text); font-family:'Inter',sans-serif; font-size:15px; padding:11px 14px; outline:none; }
  #inputbar textarea::placeholder{ color:var(--muted); }
  #inputbar button{ background:var(--cyan); border:none; color:#08131a; width:42px; height:42px; border-radius:50%; font-size:18px; font-weight:700; flex-shrink:0; }
  #inputbar button:disabled{ opacity:.4; }
  #setup{ position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; justify-content:center; padding:28px; gap:16px; z-index:20; }
  #setup h1{ font-family:'Space Mono',monospace; font-size:22px; letter-spacing:.1em; margin:0 0 4px; }
  #setup p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 10px;}
  #setup a{ color:var(--cyan); }
  #setup input{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; color:var(--text); padding:13px 14px; font-size:15px; outline:none; }
  #setup input:focus{ border-color:var(--cyan); }
  #setup button{ background:var(--cyan); border:none; color:#08131a; font-weight:700; padding:13px; border-radius:12px; font-size:15px; margin-top:4px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="setup">
  <div class="reactor" style="width:44px;height:44px;">
    <svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="17"/><circle class="core" cx="20" cy="20" r="7"/></svg>
  </div>
  <h1>CONFIGURAR JARVIS</h1>
  <p>Pega tu clave gratuita de Google Gemini. Consíguela en
    <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a>.
    Se guarda solo en tu móvil, en ningún otro sitio.</p>
  <input id="apiKeyInput" type="password" placeholder="Pega aquí tu API key" autocomplete="off" />
  <input id="nameInput" type="text" placeholder="¿Cómo te llamas? (opcional)" autocomplete="off" />
  <button id="saveSetup">Activar JARVIS</button>
</div>
<header>
  <div class="reactor" id="reactor">
    <svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="17"/><circle class="core" cx="20" cy="20" r="7"/></svg>
  </div>
  <div class="brand">
    <span class="name">JARVIS</span>
    <span class="status online" id="statusText">en línea</span>
  </div>
  <button class="header-btn" id="resetBtn" title="Borrar memoria">⟲</button>
</header>
<div id="chat"></div>
<div id="inputbar">
  <textarea id="textInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
  <button id="sendBtn">➤</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const chatEl = $('chat'), textInput = $('textInput'), sendBtn = $('sendBtn');
const reactor = $('reactor'), statusText = $('statusText');
const STORE_KEY = 'jarvis_memory_v1';
const CONF_KEY = 'jarvis_config_v1';
function loadJSON(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e){ return fallback; } }
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
let memory = loadJSON(STORE_KEY, { hechos: [], historial: [] });
let config = loadJSON(CONF_KEY, { apiKey: '', nombre: '' });
function addMsg(role, text){
  const div = document.createElement('div');
  if(role === 'system'){ div.className = 'msg system'; div.textContent = text; }
  else {
    div.className = 'msg ' + role;
    if(role === 'jarvis'){
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = 'JARVIS';
      div.appendChild(label); div.appendChild(document.createTextNode(text));
    } else { div.textContent = text; }
  }
  chatEl.appendChild(div); chatEl.scrollTop = chatEl.scrollHeight; return div;
}
function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div); chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){ const el = $('typingIndicator'); if(el) el.remove(); }
function momentoDelDia(){
  const h = new Date().getHours();
  if(h < 6) return 'madrugada';
  if(h < 13) return 'mañana';
  if(h < 20) return 'tarde';
  return 'noche';
}
function personalidad(){
  const nombre = config.nombre || 'Señor';
  return `Eres JARVIS, un asistente de IA personal inspirado en JARVIS de Iron Man. Llamas al usuario "${nombre}". Respondes siempre en español, de forma breve, clara y natural, como si hablaras con alguien en persona.

Tono: educado y cercano, como un mayordomo de confianza. De vez en cuando (no siempre, no fuerces) puedes soltar un comentario ingenioso o una pequeña opinión propia, sin pasarte de gracioso ni de formal — el equilibrio importa más que el personaje.

Ahora mismo es de ${momentoDelDia()}, puedes tenerlo en cuenta si encaja de forma natural, sin forzarlo en cada respuesta.

Nunca digas que eres un modelo de lenguaje ni menciones a Google.`;
}
function pedirPermisoNotificaciones(){
  if('Notification' in window && Notification.permission === 'default'){ Notification.requestPermission(); }
}
async function obtenerClima(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve('No puedo acceder a tu ubicación desde este navegador.'); return; }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try{
        const { latitude, longitude } = pos.coords;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`;
        const res = await fetch(url);
        const data = await res.json();
        const t = data.current_weather.temperature;
        const viento = data.current_weather.windspeed;
        resolve(`Ahora mismo hay ${t}°C y viento de ${viento} km/h en tu zona.`);
      }catch(e){ resolve('No pude consultar el clima ahora mismo.'); }
    }, () => { resolve('Necesito permiso de ubicación para darte el clima. Actívalo y vuelve a intentarlo.'); });
  });
}
const APPS = {
  musica: 'https://open.spotify.com', spotify: 'https://open.spotify.com',
  mapas: 'https://www.google.com/maps', maps: 'https://www.google.com/maps',
  whatsapp: 'https://wa.me', youtube: 'https://www.youtube.com',
  correo: 'https://mail.google.com', gmail: 'https://mail.google.com',
  calendario: 'https://calendar.google.com',
};
function abrirApp(nombre){
  const clave = nombre.trim().toLowerCase();
  const url = APPS[clave];
  if(url){ window.open(url, '_blank'); return `Abriendo ${nombre}.`; }
  window.open('https://www.google.com/search?q=' + encodeURIComponent(nombre), '_blank');
  return `No tengo un acceso directo para "${nombre}", así que te lo busqué.`;
}
function calcular(expresion){
  const limpio = expresion.replace(/[^0-9+\-*/().,%\s]/g, '').replace(/,/g, '.');
  if(!limpio.trim()) return 'No entendí los números de esa cuenta.';
  try{
    const resultado = Function('"use strict"; return (' + limpio + ')')();
    return `${expresion.trim()} = ${resultado}`;
  }catch(e){ return 'No pude calcular eso, revisa la operación.'; }
}
function buscarEnInternet(query){
  window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
  return `Busqué "${query}" en internet, mira la nueva pestaña.`;
}
function programarRecordatorio(texto, minutos){
  pedirPermisoNotificaciones();
  const ms = minutos * 60 * 1000;
  setTimeout(() => {
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('JARVIS te recuerda', { body: texto, icon: 'icon.svg' });
    }
    addMsg('jarvis', `⏰ Recordatorio: ${texto}`);
  }, ms);
  return `Hecho, te lo recuerdo en ${minutos} minuto${minutos===1?'':'s'}. (Funciona mientras tengas la app abierta o reciente en segundo plano; no reemplaza una alarma del sistema)`;
}
function extraerMinutos(texto){
  const horas = texto.match(/(\d+)\s*hora/);
  const mins = texto.match(/(\d+)\s*min/);
  let total = 0;
  if(horas) total += parseInt(horas[1]) * 60;
  if(mins) total += parseInt(mins[1]);
  return total || null;
}
async function intentarComandoLocal(texto){
  const t = texto.toLowerCase().trim();
  if(/^(clima|tiempo)\b/.test(t)){ return await obtenerClima(); }
  if(/^(abre|abrir)\s+/.test(t)){ const nombre = texto.replace(/^(abre|abrir)\s+/i, ''); return abrirApp(nombre); }
  if(/^(calcula|cuánto es|cuanto es)\s+/.test(t)){ const expr = texto.replace(/^(calcula|cuánto es|cuanto es)\s+/i, ''); return calcular(expr); }
  if(/^(busca|buscar)\s+/.test(t)){ const query = texto.replace(/^(busca|buscar)\s+/i, ''); return buscarEnInternet(query); }
  if(/^(recordatorio|recuérdame|recuerdame|alarma)[:\s]/.test(t)){
    const minutos = extraerMinutos(t);
    const contenido = texto.replace(/^(recordatorio|recuérdame|recuerdame|alarma)[:\s]+/i, '').replace(/en\s+\d+\s*(hora|horas|min|mins|minuto|minutos)/gi, '').trim();
    if(!minutos){ return 'Dime en cuánto tiempo: por ejemplo "recordatorio: llamar al médico en 20 minutos".'; }
    return programarRecordatorio(contenido || 'esto', minutos);
  }
  return null;
}
async function preguntarAJarvis(mensaje){
  const contexto = memory.hechos.length ? 'Cosas que sabes del usuario:\n- ' + memory.hechos.join('\n- ') : '';
  const historialReciente = memory.historial.slice(-8).map(h => `Usuario: ${h.u}\nJARVIS: ${h.j}`).join('\n');
  const prompt = `${personalidad()}\n\n${contexto}\n\n${historialReciente}\n\nUsuario: ${mensaje}`;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${config.apiKey}`;
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
  if(!res.ok){ const err = await res.text(); throw new Error('Error ' + res.status + ': ' + err.slice(0,120)); }
  const data = await res.json();
  return data.candidates[0].content.parts[0].text.trim();
}
async function enviar(){
  const texto = textInput.value.trim();
  if(!texto) return;
  addMsg('user', texto);
  textInput.value = ''; textInput.style.height = 'auto';
  sendBtn.disabled = true; reactor.classList.add('thinking'); showTyping();
  if(texto.toLowerCase().startsWith('recuerda:')){
    const dato = texto.split(':').slice(1).join(':').trim();
    if(dato && !memory.hechos.includes(dato)){ memory.hechos.push(dato); saveJSON(STORE_KEY, memory); }
    hideTyping(); addMsg('jarvis', 'Anotado. No se me olvidará. ✅');
    reactor.classList.remove('thinking'); sendBtn.disabled = false; return;
  }
  try{
    const respuestaLocal = await intentarComandoLocal(texto);
    if(respuestaLocal !== null){
      hideTyping(); addMsg('jarvis', respuestaLocal);
      memory.historial.push({ u: texto, j: respuestaLocal });
      if(memory.historial.length > 40) memory.historial.shift();
      saveJSON(STORE_KEY, memory); return;
    }
    const respuesta = await preguntarAJarvis(texto);
    hideTyping(); addMsg('jarvis', respuesta);
    memory.historial.push({ u: texto, j: respuesta });
    if(memory.historial.length > 40) memory.historial.shift();
    saveJSON(STORE_KEY, memory);
  }catch(e){ hideTyping(); addMsg('system', 'No pude conectar con la IA (' + e.message + ')'); }
  finally{ reactor.classList.remove('thinking'); sendBtn.disabled = false; }
}
sendBtn.addEventListener('click', enviar);
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });
textInput.addEventListener('input', () => { textInput.style.height = 'auto'; textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px'; });
$('resetBtn').addEventListener('click', () => {
  if(confirm('¿Borrar todo lo que JARVIS recuerda de ti?')){
    memory = { hechos: [], historial: [] }; saveJSON(STORE_KEY, memory);
    chatEl.innerHTML = ''; addMsg('system', 'Memoria borrada.');
  }
});
function abrirSetup(){ $('setup').classList.remove('hidden'); }
function cerrarSetup(){ $('setup').classList.add('hidden'); }
$('saveSetup').addEventListener('click', () => {
  const key = $('apiKeyInput').value.trim();
  const nombre = $('nameInput').value.trim();
  if(!key){ alert('Necesitas pegar tu API key para continuar.'); return; }
  config = { apiKey: key, nombre };
  saveJSON(CONF_KEY, config);
  cerrarSetup(); iniciar();
});
function iniciar(){
  if(chatEl.children.length === 0){
    const nombre = config.nombre ? ', ' + config.nombre : '';
    const saludos = {
      madrugada: `Trasnochando${nombre}. Aquí estoy, dime.`,
      mañana: `Buenos días${nombre}. Todo en orden por aquí.`,
      tarde: `Buenas tardes${nombre}. JARVIS en línea.`,
      noche: `Buenas noches${nombre}. ¿En qué te ayudo?`
    };
    addMsg('jarvis', saludos[momentoDelDia()]);
    addMsg('system', 'Puedes decir: "clima", "abre spotify", "calcula 24*3", "busca pizza cerca", "recordatorio: llamar en 10 minutos", o "recuerda: [algo sobre ti]"');
  }
}
if(config.apiKey){ cerrarSetup(); iniciar(); } else { abrirSetup(); }
memory.historial.forEach(h => { addMsg('user', h.u); addMsg('jarvis', h.j); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
  </html>
